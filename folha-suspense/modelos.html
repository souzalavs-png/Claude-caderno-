<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelos Suspense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Limelight&family=Playfair+Display:wght@900&family=Special+Elite&family=UnifrakturMaguntia&display=block" rel="stylesheet">
<style>
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #000; }
  .folha { position: relative; width: 210mm; height: 297mm; overflow: hidden; }
  .folha.paisagem { width: 297mm; height: 210mm; }
  .folha:not(:last-child) { break-after: page; }
  .folha > * { position: absolute; inset: 0; }
  .grao { background-size: 28mm 28mm; }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: 'Special Elite', 'Courier New', monospace; }
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute"></svg>
<div id="paginas"></div>
<script>
(async () => {
await Promise.all(['10px "Special Elite"', '10px "Limelight"', '10px "UnifrakturMaguntia"', '10px "Anton"', '900 10px "Playfair Display"']
  .map(f => document.fonts.load(f)));
await document.fonts.ready;

const q = new URLSearchParams(location.search);
const tema = q.get('tema') || 'noite';
const qual = q.get('layout') || 'todos';

const T = {
  noite: {
    papel: '#16151b', borda: '#09090c',
    linha: '#a3a8bd', linhaOp: 0.24,
    destaque: '#a3302e', tinta: '#d9d2c3', tintaSuave: '#8d8778',
    carimbo: '#c0392f', digital: '#d9d2c3', digitalOp: 0.07,
    grao: 0.05, cafe: false,
    polaroid: '#e6e1d6', foto: '#25242b', fita: '#d8b23c',
    ouro: '#c9a45c', bilhete: '#26252d', durex: '#cfc6a8', lombada: 0.45
  },
  dossie: {
    papel: '#f2e9d6', borda: '#d6c6a3',
    linha: '#6f7f97', linhaOp: 0.5,
    destaque: '#b23a32', tinta: '#2c2724', tintaSuave: '#7a6f60',
    carimbo: '#b8312b', digital: '#3a2f26', digitalOp: 0.08,
    grao: 0.09, cafe: true,
    polaroid: '#fbf8f1', foto: '#3a3631', fita: '#e3bc3e',
    ouro: '#8e6e33', bilhete: '#fbf8f0', durex: '#e6dcc0', lombada: 0.22
  }
}[tema];

// aleatório com semente fixa (o desenho sai sempre igual)
let s = 7;
const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const L = 12, R = 198;

// ---------- defs compartilhados ----------
document.getElementById('defs').innerHTML = `<defs>
  <radialGradient id="vinheta" cx="50%" cy="45%" r="75%">
    <stop offset="55%" stop-color="${T.papel}"/><stop offset="100%" stop-color="${T.borda}"/>
  </radialGradient>
  <filter id="gasto" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="0.9"/>
  </filter>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0.5" dy="0.9" stdDeviation="0.9" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <radialGradient id="someDigital">
    <stop offset="60%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="mascaraDigital"><circle cx="0" cy="0" r="24" fill="url(#someDigital)"/></mask>
  <pattern id="meiotom" width="1.3" height="1.3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="1.3" height="1.3" fill="${T.foto}" fill-opacity="0.35"/>
    <circle cx="0.65" cy="0.65" r="0.3" fill="${T.tinta}" fill-opacity="0.3"/>
  </pattern>
  <linearGradient id="lombada" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.42" stop-color="#000" stop-opacity="${T.lombada * 0.55}"/>
    <stop offset="0.5" stop-color="#000" stop-opacity="${T.lombada}"/>
    <stop offset="0.58" stop-color="#000" stop-opacity="${T.lombada * 0.55}"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
</defs>`;

// textura de papel (azulejo pequeno, deixa o PDF leve)
const grao = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const ctx = c.getContext('2d'), img = ctx.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rnd() < 0.5 ? 0 : 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = Math.floor(rnd() * 255);
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
})();

// ---------- peças ----------
let n = 0, clip = 0;
const txt = (x, y, str, o = {}) => {
  const { size = 3, cor = T.tintaSuave, ls = 0.6, anchor = 'start', op = 1, fonte } = o;
  const estilo = fonte ? ` style="font-family:${fonte}"` : '';
  return `<text id="r${++n}" x="${x}" y="${y}" font-size="${size}" fill="${cor}" fill-opacity="${op}" letter-spacing="${ls}" text-anchor="${anchor}"${estilo}>${str}</text>`;
};
// linha de preencher que começa logo depois do último texto
const campo = (x2, y, cor = T.tinta) =>
  `<line data-apos="r${n}" x1="0" y1="${y}" x2="${x2}" y2="${y}" stroke="${cor}" stroke-opacity="0.55" stroke-width="0.25"/>`;
const linha = (x1, y1, x2, y2, cor = T.tinta, op = 0.45, w = 0.18) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${cor}" stroke-opacity="${op}" stroke-width="${w}"/>`;
const caixa = (x, y, w, h, cor = T.tintaSuave) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="0.3" fill="none" stroke="${cor}" stroke-width="0.3"/>`;
const pautas = (x1, x2, y0, y1, passo = 8) => {
  const out = [];
  for (let y = y0; y <= y1 + 0.01; y += passo)
    out.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${T.linha}" stroke-opacity="${T.linhaOp}" stroke-width="0.22"/>`);
  return out.join('');
};
const separador = (y, x1 = L, x2 = R) =>
  linha(x1, y, x2, y, T.tinta, 0.7, 0.5) + linha(x1, y + 1, x2, y + 1, T.tinta, 0.45, 0.18);
const barra = (x, y) => `<text x="${x}" y="${y}" font-size="3.4" fill="${T.tintaSuave}">/</text>`;

const digital = (cx, cy, rot) => {
  const g = [];
  for (let i = 1; i <= 17; i++) {
    const rx = 1 + i * 1.25, ry = rx * 1.32;
    const per = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
    let dash = [], tot = 0;
    while (tot < per) { const a = 4 + rnd() * 16, b = 0.5 + rnd() * 1.4; dash.push(a.toFixed(2), b.toFixed(2)); tot += a + b; }
    g.push(`<ellipse cx="${((rnd() - 0.5) * 0.4).toFixed(2)}" cy="${(i * 0.18).toFixed(2)}" rx="${rx}" ry="${ry}" fill="none" stroke="${T.digital}" stroke-width="0.42" stroke-dasharray="${dash.join(' ')}" stroke-dashoffset="${(rnd() * 20).toFixed(1)}"/>`);
  }
  return `<g transform="translate(${cx},${cy}) rotate(${rot})" opacity="${T.digitalOp}"><g mask="url(#mascaraDigital)">${g.join('')}</g></g>`;
};

const cafe = (cx, cy, r) => {
  if (!T.cafe) return '';
  let d = '';
  for (let a = 0; a <= 360; a += 6) {
    const rr = r + (rnd() - 0.5) * 0.7, rad = a * Math.PI / 180;
    d += (a ? 'L' : 'M') + (cx + rr * Math.cos(rad)).toFixed(2) + ',' + (cy + rr * Math.sin(rad)).toFixed(2);
  }
  return `<path d="${d}Z" fill="#8a5a2b" fill-opacity="0.035" stroke="#7a4a1f" stroke-opacity="0.13" stroke-width="0.9"/>` +
         `<path d="${d}Z" fill="none" stroke="#7a4a1f" stroke-opacity="0.08" stroke-width="2.2" stroke-dasharray="30 8 12 20" transform="translate(0.4,0.3)"/>`;
};

const carimbo = (cx, cy, rot, palavra, w) => `<g transform="translate(${cx},${cy}) rotate(${rot})" filter="url(#gasto)" opacity="0.82">
  <rect x="${-w / 2}" y="-6.6" width="${w}" height="13.2" rx="1" fill="none" stroke="${T.carimbo}" stroke-width="0.9"/>
  <rect x="${-w / 2 + 1.6}" y="-5" width="${w - 3.2}" height="10" rx="0.6" fill="none" stroke="${T.carimbo}" stroke-width="0.35"/>
  <text x="0" y="1.9" text-anchor="middle" font-size="5.4" fill="${T.carimbo}" textLength="${w - 9}" lengthAdjust="spacingAndGlyphs">${palavra}</text>
</g>`;

const gota = 'M0,-2.6 C1.2,-0.9 1.9,0.3 1.9,1.1 A1.9,1.9 0 1 1 -1.9,1.1 C-1.9,0.3 -1.2,-0.9 0,-2.6 Z';
const tensao = (x, y) => {
  let out = txt(x, y, 'TENSÃO', { size: 2.8 });
  for (let i = 0; i < 5; i++)
    out += `<path d="${gota}" transform="translate(${x + 19 + i * 5.4},${y - 1.4})" fill="none" stroke="${T.destaque}" stroke-opacity="0.9" stroke-width="0.32"/>`;
  return out;
};
const pagina = (y) => txt(168, y, 'PÁG.', { size: 2.8 }) + campo(R, y + 0.3);

const fita = (cx, cy, ang, len) => {
  const id = 'fita' + (++clip);
  const frase = 'CENA DO CRIME · NÃO ULTRAPASSE · ';
  return `<g transform="translate(${cx},${cy}) rotate(${ang})" filter="url(#sombra)">
    <clipPath id="${id}"><rect x="${-len / 2}" y="-4.5" width="${len}" height="9"/></clipPath>
    <rect x="${-len / 2}" y="-4.5" width="${len}" height="9" fill="${T.fita}"/>
    <g clip-path="url(#${id})">
      <line x1="${-len / 2}" y1="-3.7" x2="${len / 2}" y2="-3.7" stroke="#1a1712" stroke-width="0.35"/>
      <line x1="${-len / 2}" y1="3.7" x2="${len / 2}" y2="3.7" stroke="#1a1712" stroke-width="0.35"/>
      <text x="${-len / 2 + 2}" y="1.3" font-size="3.6" fill="#1a1712" letter-spacing="0.5">${frase.repeat(4)}</text>
    </g>
  </g>`;
};

// ---------- MODELOS ----------
const modelos = {

  // 1) Relatório policial
  relatorio() {
    const f = [cafe(4, 150, 14)], c = [];
    c.push(txt(105, 14.5, 'DIVISÃO DE CASOS SEM SOLUÇÃO', { size: 2.5, ls: 1, anchor: 'middle' }));
    c.push(txt(105, 23.5, 'RELATÓRIO DE OCORRÊNCIA', { size: 5.8, cor: T.tinta, ls: 1.1, anchor: 'middle' }));
    c.push(carimbo(181, 15, 7, 'SIGILOSO', 30));

    const y0 = 30, y1 = 43, y2 = 56;
    c.push(`<rect x="${L}" y="${y0}" width="${R - L}" height="${y2 - y0}" fill="none" stroke="${T.tinta}" stroke-opacity="0.6" stroke-width="0.35"/>`);
    c.push(linha(L, y1, R, y1, T.tinta, 0.5, 0.25));
    for (const x of [62, 132, 165]) c.push(linha(x, y0, x, y1, T.tinta, 0.5, 0.25));
    c.push(linha(105, y1, 105, y2, T.tinta, 0.5, 0.25));
    const rot = (x, y, s) => txt(x, y, s, { size: 2.2, ls: 0.5 });
    c.push(rot(L + 1.8, y0 + 3.6, 'Nº OCORRÊNCIA'), rot(63.8, y0 + 3.6, 'CAPÍTULO'),
           rot(133.8, y0 + 3.6, 'DATA'), rot(166.8, y0 + 3.6, 'HORA'),
           rot(L + 1.8, y1 + 3.6, 'LOCAL'), rot(106.8, y1 + 3.6, 'ENVOLVIDOS'));
    c.push(barra(142.5, y1 - 3), barra(152.5, y1 - 3));
    c.push(`<text x="181" y="${y1 - 3}" font-size="3.4" fill="${T.tintaSuave}" text-anchor="middle">:</text>`);

    c.push(txt(L, 64, 'RELATO DOS FATOS', { size: 3, cor: T.tinta, ls: 0.8 }));
    c.push(linha(L, 66, R, 66));
    c.push(pautas(L, R, 74, 266));
    c.push(digital(38, 246, 20));

    c.push(linha(L, 276, R, 276));
    c.push(txt(L, 284, 'INVESTIGADOR', { size: 2.6 }), campo(84, 284.3));
    c.push(txt(94, 284, 'STATUS', { size: 2.6 }));
    c.push(caixa(111, 281.4, 3, 3), txt(115.8, 284, 'ABERTO', { size: 2.6 }));
    c.push(caixa(134, 281.4, 3, 3), txt(138.8, 284, 'ENCERRADO', { size: 2.6 }));
    c.push(txt(168, 284, 'FL.', { size: 2.6 }), campo(R, 284.3));
    return { f, c };
  },

  // 2) Evidência com foto polaroid
  evidencia() {
    const f = [cafe(203, 165, 15)], c = [];
    const escuro = '#4a453f';
    c.push(`<g transform="translate(48,55) rotate(-4)">
      <rect x="-35" y="-41" width="70" height="82" fill="${T.polaroid}" filter="url(#sombra)"/>
      <rect x="-31" y="-37" width="62" height="60" fill="${T.foto}"/>
      ${txt(-30, 33.5, 'EVIDÊNCIA Nº', { size: 2.9, cor: escuro, ls: 0.6 })}${campo(30, 33.8, escuro)}
      <ellipse cx="0.6" cy="-36.4" rx="2.6" ry="1.4" fill="#000" fill-opacity="0.25"/>
      <circle cx="0" cy="-38" r="2.5" fill="${T.carimbo}"/>
      <circle cx="-0.8" cy="-38.8" r="0.8" fill="#fff" fill-opacity="0.45"/>
    </g>`);
    const x0 = 95;
    c.push(txt(x0, 20, 'ARQUIVO · CASO Nº', { size: 2.6 }), campo(R, 20.3));
    c.push(txt(x0, 33, 'CAPÍTULO', { size: 6.4, cor: T.tinta, ls: 1.2 }), campo(R, 33.3));
    c.push(txt(x0, 44, 'CENA'), campo(146, 44.3));
    c.push(txt(151, 44, 'DATA'), campo(R, 44.3), barra(172, 43.8), barra(185, 43.8));
    c.push(separador(49.5, x0));
    c.push(pautas(x0, R, 58, 98));
    c.push(pautas(L, R, 106, 274));
    c.push(digital(178, 200, -12));

    c.push(linha(L, 280, R, 280));
    c.push(tensao(L, 287.6), pagina(287.6));
    return { f, c };
  },

  // 3) Contagem regressiva (hora em cada linha)
  contagem() {
    const f = [cafe(8, 232, 14)], c = [];
    c.push(txt(L, 15.5, 'ARQUIVO · CASO Nº', { size: 2.6 }), campo(70, 15.8));
    c.push(txt(L, 27.5, 'CONTAGEM REGRESSIVA', { size: 6.4, cor: T.tinta, ls: 1.2 }));
    c.push(txt(L, 37.5, 'CAPÍTULO'), campo(70, 37.8));
    c.push(txt(75, 37.5, 'CENA'), campo(118, 37.8));
    c.push(txt(123, 37.5, 'DATA'), campo(163, 37.8));

    // relógio quase meia-noite
    const cx = 183, cy = 24, r = 11;
    let rel = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${T.tinta}" stroke-opacity="0.7" stroke-width="0.45"/>`;
    rel += `<circle cx="${cx}" cy="${cy}" r="${r - 1}" fill="none" stroke="${T.tinta}" stroke-opacity="0.35" stroke-width="0.15"/>`;
    for (let i = 0; i < 60; i++) {
      const a = i * 6 * Math.PI / 180, grande = i % 5 === 0;
      const r1 = r - 1.4, r2 = grande ? r - 3.2 : r - 2;
      rel += `<line x1="${(cx + r1 * Math.sin(a)).toFixed(2)}" y1="${(cy - r1 * Math.cos(a)).toFixed(2)}" x2="${(cx + r2 * Math.sin(a)).toFixed(2)}" y2="${(cy - r2 * Math.cos(a)).toFixed(2)}" stroke="${T.tinta}" stroke-opacity="${grande ? 0.75 : 0.35}" stroke-width="${grande ? 0.35 : 0.15}"/>`;
    }
    const ponteiro = (graus, comp, w, cor, op = 0.85) => {
      const a = graus * Math.PI / 180;
      return `<line x1="${cx}" y1="${cy}" x2="${(cx + comp * Math.sin(a)).toFixed(2)}" y2="${(cy - comp * Math.cos(a)).toFixed(2)}" stroke="${cor}" stroke-opacity="${op}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    rel += ponteiro(358.9, 5.2, 0.7, T.tinta) + ponteiro(348, 7.6, 0.45, T.tinta) + ponteiro(300, 8.2, 0.2, T.destaque, 1);
    rel += `<circle cx="${cx}" cy="${cy}" r="0.6" fill="${T.destaque}"/>`;
    c.push(rel);

    c.push(separador(42.6));
    c.push(pautas(L, R, 52, 276));
    for (let y = 52; y <= 276; y += 8) {
      c.push(`<text x="20.5" y="${y - 1.5}" font-size="3.2" fill="${T.tintaSuave}" fill-opacity="0.7" text-anchor="middle">:</text>`);
      c.push(linha(29, y - 3.2, 29, y, T.tintaSuave, 0.45, 0.15));
    }
    c.push(digital(176, 244, -18));

    c.push(linha(L, 280, R, 280));
    c.push(txt(L, 287.6, 'TEMPO RESTANTE', { size: 2.8 }));
    for (let i = 0; i < 10; i++) c.push(caixa(49 + i * 4.3, 284.7, 3, 3, T.destaque));
    c.push(pagina(287.6));
    return { f, c };
  },

  // 4) Cena do crime (fitas de isolamento)
  cena() {
    const f = [], c = [];
    c.push(txt(L, 15.5, 'ARQUIVO · CASO Nº', { size: 2.6 }), campo(76, 15.8));
    c.push(txt(L, 27.5, 'CAPÍTULO', { size: 6.4, cor: T.tinta, ls: 1.2 }), campo(126, 27.8));
    c.push(txt(L, 37.5, 'CENA'), campo(68, 37.8));
    c.push(txt(73, 37.5, 'DATA'), campo(126, 37.8), barra(97, 37.3), barra(110, 37.3));
    c.push(separador(42.6));
    c.push(pautas(L, R, 52, 276));

    c.push(linha(L, 280, R, 280));
    c.push(tensao(96, 287.6), pagina(287.6));

    c.push(fita(177, 19, 33.7, 120));
    c.push(fita(174, 23, -22, 110));
    c.push(fita(30, 278, 33.7, 120));
    return { f, c };
  },

  // ================= LAYOUTS DIFERENTES =================

  // 5) Jornal antigo em 2 colunas
  jornal() {
    const f = [cafe(201, 252, 15)], c = [];
    const M = 105, c1b = 101, c2a = 109;
    c.push(linha(L, 11, R, 11, T.tinta, 0.6, 0.25));
    c.push(txt(L, 16, 'EDIÇÃO Nº', { size: 2.4 }), campo(48, 16.3));
    c.push(txt(R, 16, 'ÚLTIMA HORA', { size: 2.4, cor: T.destaque, ls: 0.8, anchor: 'end' }));
    c.push(txt(M, 31, 'Diário da Meia-Noite', { size: 13, cor: T.tinta, ls: 0.3, anchor: 'middle', fonte: "'UnifrakturMaguntia'" }));
    c.push(linha(L, 35, R, 35, T.tinta, 0.8, 0.6), linha(L, 36.3, R, 36.3, T.tinta, 0.6, 0.2));
    c.push(txt(L, 41, 'CAPÍTULO', { size: 2.6 }), campo(64, 41.3));
    c.push(txt(M, 41, 'SÓ AS NOTÍCIAS QUE NINGUÉM QUER LER', { size: 2.2, anchor: 'middle' }));
    c.push(txt(150, 41, 'DATA', { size: 2.6 }), campo(R, 41.3), barra(171, 40.8), barra(184, 40.8));
    c.push(linha(L, 44, R, 44, T.tinta, 0.6, 0.25));

    c.push(txt(L, 50, 'MANCHETE', { size: 2.2, cor: T.destaque, ls: 1 }));
    c.push(linha(L, 59, R, 59, T.linha, Math.min(1, T.linhaOp * 1.8), 0.3));
    c.push(linha(L, 69, R, 69, T.linha, Math.min(1, T.linhaOp * 1.8), 0.3));
    c.push(linha(L, 74, R, 74, T.tinta, 0.6, 0.25));

    c.push(`<rect x="${L}" y="79" width="${c1b - L}" height="46" fill="url(#meiotom)" stroke="${T.tinta}" stroke-opacity="0.5" stroke-width="0.3"/>`);
    c.push(txt(L, 131, 'LEGENDA', { size: 2.2 }), campo(c1b, 131.3));
    c.push(pautas(L, c1b, 140, 276));
    c.push(pautas(c2a, R, 84, 276));

    c.push(linha(L, 281, R, 281, T.tinta, 0.6, 0.25));
    c.push(txt(92, 287.5, 'CONTINUA NA PÁGINA', { size: 2.6, anchor: 'middle' }), campo(128, 287.8));
    return { f, c };
  },

  // 6) Moldura noir anos 20 (art déco)
  noir() {
    const f = [], c = [], o = T.ouro;
    c.push(`<rect x="9" y="9" width="192" height="279" fill="none" stroke="${o}" stroke-opacity="0.85" stroke-width="0.5"/>`);
    c.push(`<rect x="11.2" y="11.2" width="187.6" height="274.6" fill="none" stroke="${o}" stroke-opacity="0.6" stroke-width="0.2"/>`);
    const leque = (x, y, sx, sy) => {
      let g = '';
      for (const r of [5, 7.5, 10]) g += `<path d="M${r},0 A${r},${r} 0 0 1 0,${r}" fill="none" stroke="${o}" stroke-opacity="0.75" stroke-width="${r === 10 ? 0.35 : 0.2}"/>`;
      for (let i = 1; i < 6; i++) {
        const a = i * 15 * Math.PI / 180;
        g += `<line x1="${(3 * Math.cos(a)).toFixed(2)}" y1="${(3 * Math.sin(a)).toFixed(2)}" x2="${(14 * Math.cos(a)).toFixed(2)}" y2="${(14 * Math.sin(a)).toFixed(2)}" stroke="${o}" stroke-opacity="0.5" stroke-width="0.18"/>`;
      }
      return `<g transform="translate(${x},${y}) scale(${sx},${sy})">${g}</g>`;
    };
    c.push(leque(11.2, 11.2, 1, 1), leque(198.8, 11.2, -1, 1), leque(11.2, 285.8, 1, -1), leque(198.8, 285.8, -1, -1));
    const losango = (cx, cy, r, cheio = false, w = 0.3) =>
      `<path d="M${cx},${cy - r} L${cx + r},${cy} L${cx},${cy + r} L${cx - r},${cy}Z" fill="${cheio ? o : 'none'}" fill-opacity="0.85" stroke="${o}" stroke-opacity="0.85" stroke-width="${w}"/>`;

    c.push(linha(55, 24, 99, 24, o, 0.7, 0.25), losango(105, 24, 3), losango(105, 24, 1.2, true), linha(111, 24, 155, 24, o, 0.7, 0.25));
    c.push(txt(106.5, 38.5, 'CAPÍTULO', { size: 9, cor: T.tinta, ls: 3, anchor: 'middle', fonte: "'Limelight'" }));
    c.push(linha(72, 49, 138, 49, T.tinta, 0.55, 0.25), losango(70.5, 49, 0.9, true), losango(139.5, 49, 0.9, true));
    c.push(linha(40, 57, 96, 57, o, 0.6, 0.2), losango(100, 57, 0.9, true), losango(105, 57, 1.3, true), losango(110, 57, 0.9, true), linha(114, 57, 170, 57, o, 0.6, 0.2));

    c.push(pautas(22, 188, 68, 260));

    c.push(linha(55, 274, 96, 274, o, 0.7, 0.25), losango(105, 274, 7, false, 0.35), losango(105, 274, 5.8, false, 0.15), linha(114, 274, 155, 274, o, 0.7, 0.25));
    return { f, c };
  },

  // 7) Livro aberto (folha deitada, 2 páginas)
  livro() {
    const W = 297, H = 210, f = [], c = [];
    f.push(cafe(292, 32, 14));
    f.push(`<rect x="${W / 2 - 16}" y="0" width="32" height="${H}" fill="url(#lombada)"/>`);
    f.push(linha(W / 2, 0, W / 2, H, '#000', 0.3, 0.25));
    const pag = [[16, 136], [161, 281]];
    c.push(txt(16, 16, 'HISTÓRIA', { size: 2.4 }), campo(136, 16.3));
    c.push(txt(161, 16, 'CAPÍTULO', { size: 2.4 }), campo(281, 16.3));
    for (const [a, b] of pag) {
      c.push(linha(a, 20.5, b, 20.5, T.tinta, 0.4, 0.2));
      c.push(pautas(a, b, 30, 190));
    }
    c.push(digital(258, 170, -15));
    c.push(txt(16, 200, 'PÁG.', { size: 2.4 }), campo(34, 200.3));
    c.push(txt(263, 200, 'PÁG.', { size: 2.4 }), campo(281, 200.3));
    return { f, c, paisagem: true };
  },

  // 8) Bilhete anônimo (papel rasgado + letras recortadas)
  bilhete() {
    const f = [], c = [];
    const x0 = 16, x1 = 194, y0 = 18, y1 = 281;
    const p = [];
    for (let x = x0; x <= x1; x += 2) p.push([x, y0 + (rnd() - 0.5) * 1.8]);
    for (let y = y0 + 4; y < y1; y += 4) p.push([x1 + (rnd() - 0.5) * 0.7, y]);
    for (let x = x1; x >= x0; x -= 2) p.push([x, y1 + (rnd() - 0.5) * 1.8]);
    for (let y = y1 - 4; y > y0; y -= 4) p.push([x0 + (rnd() - 0.5) * 0.7, y]);
    const d = 'M' + p.map(([x, y]) => x.toFixed(2) + ',' + y.toFixed(2)).join('L') + 'Z';
    f.push(`<path d="${d}" fill="#000" fill-opacity="0.28" transform="translate(0.8,1.4)"/>`);
    f.push(`<path d="${d}" fill="${T.bilhete}"/>`);

    const durex = (x, y, a) => `<rect x="-11" y="-3.5" width="22" height="7" fill="${T.durex}" fill-opacity="0.6" transform="translate(${x},${y}) rotate(${a})"/>`;
    c.push(durex(x0 + 3, y0 + 3, -35), durex(x1 - 3, y0 + 3, 35));

    const cores = [['#e2cf9e', '#1a1a1a'], ['#1f1f1f', '#f2efe6'], ['#b8312b', '#fff6ea'], ['#cfd8dc', '#1a1a1a'],
                   ['#d9c27a', '#1a1a1a'], ['#3d4b5c', '#f2efe6'], ['#e8d2c4', '#7a2420'], ['#7a2420', '#f3e7d3']];
    const fontes = [["'Special Elite'", 400], ["'Limelight'", 400], ["'Anton'", 400], ["'Playfair Display'", 900], ["'DejaVu Serif'", 700]];
    const recorte = (letras, xIni, yBase, passo, escala) => {
      let out = '';
      [...letras].forEach((ch, i) => {
        const [fundo, tinta] = cores[(i * 3 + Math.floor(rnd() * 2)) % cores.length];
        const [fam, peso] = fontes[(i * 2 + Math.floor(rnd() * 3)) % fontes.length];
        const w = (9.5 + rnd() * 2.2) * escala, h = (11.5 + rnd() * 2.5) * escala;
        const rot = ((rnd() - 0.5) * 12).toFixed(1), dy = ((rnd() - 0.5) * 2.2 * escala).toFixed(2);
        const tam = ((7.5 + rnd() * 2.5) * escala).toFixed(2);
        out += `<g transform="translate(${(xIni + i * passo).toFixed(2)},${(yBase + +dy).toFixed(2)}) rotate(${rot})">
          <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${fundo}" stroke="#000" stroke-opacity="0.3" stroke-width="0.18"/>
          <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="${tam}" fill="${tinta}" style="font-family:${fam};font-weight:${peso}">${ch}</text>
        </g>`;
      });
      return out;
    };
    const titulo = 'CAPÍTULO', passo = 12.2;
    c.push(recorte(titulo, 105 - (titulo.length - 1) * passo / 2, 38, passo, 1));
    c.push(linha(70, 56, 140, 56, T.tinta, 0.55, 0.25));

    c.push(pautas(26, 184, 66, 258));

    c.push(recorte('PÁG', 150, 271, 7.6, 0.62));
    c.push(linha(169, 274, 184, 274, T.tinta, 0.55, 0.25));
    return { f, c };
  }
};

// ---------- monta as páginas ----------
const grupos = {
  todos: ['relatorio', 'evidencia', 'contagem', 'cena'],
  diferentes: ['jornal', 'noir', 'livro', 'bilhete']
};
const lista = grupos[qual] || [qual];
const box = document.getElementById('paginas');
for (const nome of lista) {
  const { f, c, paisagem } = modelos[nome]();
  const W = paisagem ? 297 : 210, H = paisagem ? 210 : 297;
  const div = document.createElement('div');
  div.className = 'folha' + (paisagem ? ' paisagem' : '');
  if (paisagem && lista.length === 1) {
    const st = document.createElement('style');
    st.textContent = '@page { size: 297mm 210mm; margin: 0; }';
    document.head.appendChild(st);
  }
  div.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="url(#vinheta)"/>${f.join('')}</svg>
    <div class="grao" style="background-image:url(${grao});opacity:${T.grao}"></div>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${c.join('\n')}</svg>`;
  box.appendChild(div);
}

document.querySelectorAll('line[data-apos]').forEach(l => {
  const bb = document.getElementById(l.dataset.apos).getBBox();
  l.setAttribute('x1', (bb.x + bb.width + 1.8).toFixed(2));
});
window.pronto = true;
})();
</script>
